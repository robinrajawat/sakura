# Cloudflare Worker config for Sakura's server at ai.sakura-notes.com: hosted AI
# (docs/ai-hosted-vault-design.md), PDF files (src/pdf.ts) and the read-only MCP server
# (docs/mcp-plan.md). Live: .github/workflows/deploy-worker.yml deploys it on every push to
# main that touches worker/. This file alone is not
# enough to deploy: the two required secrets aren't set here at all (secrets are
# provisioned via `wrangler secret put <NAME>`, never committed). The KV namespace id
# below is real (the "sakura-vault-kv" namespace, created via the Cloudflare dashboard) —
# a namespace id isn't a secret on its own, it grants nothing without real account
# credentials, so it's safe to commit same as the KV namespace ids in most public
# wrangler.toml files.
#
# Before a real deploy:
#   1. Done — SAKURA_VAULT_KV below points at the real "sakura-vault-kv" namespace.
#   2. `wrangler secret put VAULT_KEK` — the AES-256-GCM key-encryption-key for the
#      provider API keys stored in KV (see src/vault.ts; generate one with
#      `openssl rand -base64 32`).
#   3. `wrangler secret put ADMIN_UID` — your own Firebase UID, gates every
#      /admin/providers request (see src/auth.ts's isAdmin).
#   4. Confirm `FIREBASE_PROJECT_ID` below still matches legacy/index.html's own
#      FIREBASE_CONFIG.projectId (currently "sakura-4cdae") before relying on token
#      verification.
#   5. Deploy, then sign in as the admin and call `POST /admin/providers` for each
#      provider that funds hosted mode (Groq/Cerebras per the design doc's cost-control
#      section) — provider API keys are admin-submitted through this endpoint and
#      encrypted into KV, not set as individual Worker secrets. No separate bootstrapping
#      step: the very first provider goes in through the same endpoint as every later one.

name = "sakura-vault"
main = "src/index.ts"
compatibility_date = "2026-08-31"
# @cloudflare/puppeteer (POST /pdf) needs the Node.js compatibility layer.
# global_fetch_strictly_public: the OAuth library fetches client metadata documents (CIMD) from
# addresses an assistant gives; this keeps those fetches on the public internet.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[vars]
FIREBASE_PROJECT_ID = "sakura-4cdae"
# Requests per signed-in user per UTC day against hosted AI (src/quota.ts). A plain [vars]
# entry, not a secret, so it's tunable without touching code — still needs a real number
# chosen before launch (see docs/ai-hosted-vault-design.md's "Open decisions").
DAILY_AI_QUOTA = "20"
# PDF files per signed-in user per UTC day (POST /pdf, src/pdf.ts). Separate from the AI quota.
DAILY_PDF_QUOTA = "50"
# Firebase's public web API key (the same one in web/index.html's FIREBASE_CONFIG; not a secret):
# the MCP server turns a connection's refresh token into an ID token with it (src/firestoreRest.ts).
FIREBASE_API_KEY = "AIzaSyB0WitU2dazVbt_MCkkxZuL_pxSH76Xlj0"

[[kv_namespaces]]
binding = "SAKURA_VAULT_KV"
id = "160c845516104abbb49306c740e809ed"

# The MCP server's OAuth store (@cloudflare/workers-oauth-provider needs the binding named OAUTH_KV):
# the same namespace, under the library's own key prefixes (client:, grant:, token:, …), which don't
# meet this Worker's (provider:, config:, quota keys).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "160c845516104abbb49306c740e809ed"

# Cloudflare Browser Rendering: POST /pdf prints the app's HTML to a PDF in headless Chrome.
# Free plan: 10 browser-minutes a day, 3 browsers at once, one new browser every 20 seconds.
[browser]
binding = "BROWSER"
