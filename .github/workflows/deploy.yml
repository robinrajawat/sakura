name: Deploy

# Publishes legacy/'s dist/ — the current production single-file app (index.html/hub.html)
# — via actions/deploy-pages. www.sakura-notes.com is served from this workflow's output on
# every push to main. See docs/architecture-plan.md for Stage 1/2's full history, and
# docs/framework-migration-plan.md for the legacy/+web/ npm-workspaces split this workflow
# was updated for — legacy/'s build output and behavior are otherwise unchanged by that
# split; web/ (the new React app) is not deployed anywhere yet, and won't be until the
# migration's own Phase 5 cutover, made deliberately and separately, same discipline Stage 2
# itself followed.
#
# Runs on push to main only (not every branch/PR — that's what `verify` (ci.yml) is for), so
# what's published always matches what's actually on main.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root — installs both workspaces)
        run: npm ci

      - name: Build legacy/ (vite build; legacy/public/ handles static passthrough natively)
        run: npm run build -w sakura-legacy

      - name: Upload legacy/dist/ as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: legacy/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
