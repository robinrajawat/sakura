name: Deploy

# Publishes web/'s dist/ (the production single-file app) via actions/deploy-pages.
# www.sakura-notes.com is served from this workflow's output on every push to main.
#
# See docs/history/architecture-plan.md for Stage 1/2's full history.
#
# Runs on push to main only (not every branch/PR — that's what `verify` (ci.yml) is for), so
# what's published always matches what's actually on main.

# A push that only changes documentation (everything under docs/ or ending in .md, the same rule
# as ci.yml's docs-only check) changes nothing that is built, so it doesn't redeploy. A push with
# any other file deploys as before; a manual run always deploys.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (root — installs both workspaces)
        run: npm ci

      - name: Build web/ (vite build; web/public/ handles static passthrough natively)
        run: npm run build -w sakura-web

      - name: Upload web/dist as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
