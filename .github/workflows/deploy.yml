name: Deploy

# Publishes legacy/'s dist/ (the current production single-file app) via actions/deploy-pages.
# www.sakura-notes.com is served from this workflow's output on every push to main.
#
# TEMPORARY REVERT (see git history for the full story): briefly repointed at web/dist/ for a
# Phase 5 cutover, then reverted back here within the hour -- web/'s outlineStore.ts still
# boots every visitor into its Phase 0 validation-spike seed content ("Welcome to the Sakura
# web spike", "nodeMutations.ts — indent/outdent/move, byte-identical to legacy", etc.) by
# default, since documentsStore's real multi-doc model was never wired to auto-load on boot --
# App.tsx has no useEffect or store call that replaces the seed with a real document, signed in
# or not. That's fine for local dev (it's what the Phase 0 spike comment in outlineStore.ts
# always said it was) but is not acceptable production content, and shipping it was a real
# review miss before the cutover PR was proposed and merged -- it should have been checked by
# actually loading the built app, not just verifying the build succeeded and the bundle
# contained the right files. legacy/ is back live until that gap is closed and re-verified by
# actually opening the deployed build, not just checking that it builds. (That specific bug is
# fixed now -- documentsStore.ts's own first-launch path creates a real "Welcome to Sakura"
# document explicitly, no longer adopting outlineStore's transient seed -- but the underlying
# rule this comment exists to enforce, verify by opening the real deployed build rather than
# trusting a green build, still stands for the real cutover.)
#
# See docs/history/architecture-plan.md for Stage 1/2's full history, and docs/framework-migration-plan.md
# for the legacy/+web/ npm-workspaces split this workflow was updated for.
#
# TEMPORARY §9 pre-cutover-gate addition: also builds web/dist and publishes it alongside
# legacy at /web-preview/ (NOT the site root -- legacy's own root behavior is completely
# untouched by this addition), so a person can exercise the real built web/ app -- sign-in,
# sync against the real production Firestore project, editing, export -- from a real public
# URL instead of a locally-run build, per docs/phase6-full-parity-plan.md's Section 9 gate
# items 2-3. Remove the "Build web/ preview" and "Assemble combined Pages artifact" steps below
# (reverting the final upload step's `path` back to `legacy/dist` directly) once that gate is
# cleared and the real deploy.yml cutover (gate item 4) replaces this whole file's meaning
# instead -- at that point web/ becomes the root and this subpath is redundant.
#
# Runs on push to main only (not every branch/PR — that's what `verify` (ci.yml) is for), so
# what's published always matches what's actually on main.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root — installs both workspaces)
        run: npm ci

      - name: Build legacy/ (vite build; legacy/public/ handles static passthrough natively)
        run: npm run build -w sakura-legacy

      # Served at a subpath, not the site root -- overrides just the base via a direct vite
      # invocation (web/'s own `npm run build` always uses base=/ for real future-cutover use,
      # so this step deliberately doesn't touch that script or web/vite.config.ts).
      - name: Build web/ preview (base=/web-preview/)
        working-directory: web
        run: |
          npx vite build --base=/web-preview/
          node scripts/generate-sw-precache.mjs

      - name: Assemble combined Pages artifact (legacy at root, web/ preview under /web-preview/)
        run: |
          mkdir -p combined
          cp -r legacy/dist/. combined/
          mkdir -p combined/web-preview
          cp -r web/dist/. combined/web-preview/
          rm -f combined/web-preview/CNAME
          printf 'User-agent: *\nDisallow: /web-preview/\n' > combined/robots.txt

      - name: Upload combined artifact as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
