name: Deploy

# Publishes web/'s dist/ — the React rewrite (docs/framework-migration-plan.md), live at
# www.sakura-notes.com as of Phase 5's cutover. Previously published legacy/'s dist/ (the
# original single-file app); legacy/ is kept in the repo, still fully verified by ci.yml, and
# can be repointed back here in one revert if a real regression surfaces post-cutover — this
# is Stage 2's own "mechanism itself changes, explicit and separate" cutover discipline,
# applied a second time (see docs/architecture-plan.md for Stage 1/2's history, and
# docs/phase5-parity-checklist.md for the honest, checked-in record of exactly what this
# build can and can't do yet as of this cutover).
#
# Runs on push to main only (not every branch/PR — that's what `verify` (ci.yml) is for), so
# what's published always matches what's actually on main.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root — installs both workspaces)
        run: npm ci

      - name: Build web/ (vite build; web/public/ handles static passthrough natively)
        run: npm run build -w sakura-web

      - name: Upload web/dist/ as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
