name: Deploy

# Stage 2 of "properly deployable dist/" (docs/architecture-plan.md). Builds the exact same
# dist/ the `verify` workflow already builds and tests on every PR, and publishes it via
# actions/deploy-pages. The repo's Pages source is now "GitHub Actions" (flipped from
# "Deploy from a branch" as part of this same change) — www.sakura-notes.com is served from
# this workflow's output on every push to main. See docs/architecture-plan.md for the full
# history: Stage 1 (build + upload the artifact without publishing it) ran unpublished across
# the whole migration to prove the pipeline end-to-end before this cutover.
#
# Runs on push to main only (not every branch/PR — that's what `verify` is for), so what's
# published always matches what's actually on main.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (vite build + static passthrough assets — see scripts/copy-static-assets.mjs)
        run: npm run build

      - name: Upload dist/ as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
