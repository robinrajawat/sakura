name: CI

# Verification only — see .github/workflows/deploy.yml for the separate publish workflow
# (production, www.sakura-notes.com, is served from web/'s CI-built dist/ via GitHub
# Actions as of Stage 2, docs/history/architecture-plan.md). This workflow's job is to make sure
# every change is well-verified before it ever reaches deploy.yml. verify-web (web-checks plus
# web-e2e's shards, below) runs the full
# gauntlet — typecheck, lint, unit tests, generated-code drift check, build, e2e tests, and HTML
# structure validation — the four checks that would have caught this project's past bugs (the
# FOLDERS_KEY-class TDZ crashes, and the RAWTEXT-hijack class
# web/scripts/validate_html_structure.py guards against).
# verify-worker covers worker/ (docs/ai-hosted-vault-design.md's Cloudflare Worker) —
# typecheck/lint/unit tests only, no wrangler dev or deploy. verify-rules runs firebase/rules.test.mjs
# against firebase/firestore.rules in the Firestore emulator (the rules themselves are published by
# hand in the Firebase Console, so this checks the repo's copy). The real deploy runs from a
# separate workflow, deploy-worker.yml, triggered by a push to main that touches worker/ (not
# by this workflow) — see that file for the Cloudflare credentials it needs.
#
# Runs once per PR (pull_request), plus on pushes to main; branch pushes alone don't run it.
# When every changed file is under docs/ or ends in .md, the `changes` job says so and both verify
# jobs are skipped. A job skipped by its `if:` reports as passed, so required checks don't block
# docs-only PRs. Nothing in the build or tests reads a .md file.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# A newer push to the same PR cancels the older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docs-only change?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh .github/scripts/docs-only.sh >> "$GITHUB_OUTPUT"

  # verify-web is split so it takes minutes, not ~9 (owner 2026-11-22): `web-checks` runs the fast
  # checks, `web-e2e` runs the browser tests in 4 parallel shards, and `verify-web` (the name branch
  # protection requires) passes only when all of them passed. Same checks as before, run in parallel.
  web-checks:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 can't install Chromium on.
    # Move back to ubuntu-latest when Playwright is upgraded to a release that supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (root — installs every workspace)
        run: npm ci

      - name: Typecheck (web/src/)
        run: npm run typecheck -w sakura-web

      - name: Lint (web/src/, web/tests/)
        run: npm run lint -w sakura-web

      - name: Unit tests
        run: npm run test:unit -w sakura-web

      - name: Verify generated code matches source (Phase 2 codegen)
        run: npm run generate:verify -w sakura-web

      - name: Build
        run: npm run build -w sakura-web

      - name: HTML structure validation (existing repo safeguard)
        run: |
          pip install html5lib --break-system-packages --quiet
          cd web && python3 scripts/validate_html_structure.py

  web-e2e:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04 # pinned, see web-checks
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (root — installs every workspace)
        run: npm ci

      # The browsers are kept between runs (keyed on the lockfile, so a Playwright upgrade fetches
      # new ones); the system libraries they need are still installed each time.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build (some tests check the built output)
        run: npm run build -w sakura-web

      - name: End-to-end tests, shard ${{ matrix.shard }} of 4
        run: npm run test:e2e -w sakura-web -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: web/playwright-report/
          retention-days: 14

  verify-web:
    needs: [changes, web-checks, web-e2e]
    # Runs even when a part failed, so it can fail too; skipped (and so passing) for docs-only changes.
    if: always() && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: All web checks and every test shard passed
        env:
          CHECKS: ${{ needs.web-checks.result }}
          E2E: ${{ needs.web-e2e.result }}
        run: |
          echo "web-checks: $CHECKS, web-e2e: $E2E"
          test "$CHECKS" = success && test "$E2E" = success

  verify-worker:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (root — installs every workspace)
        run: npm ci

      - name: Typecheck (worker/src/, worker/tests/)
        run: npm run typecheck -w sakura-worker

      - name: Lint (worker/src/, worker/tests/)
        run: npm run lint -w sakura-worker

      - name: Unit tests
        run: npm run test:unit -w sakura-worker

  verify-rules:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: firebase/package-lock.json

      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache the Firestore emulator download
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-${{ hashFiles('firebase/package-lock.json') }}

      - name: Install the emulator tools (firebase/ has its own lockfile, not a workspace)
        run: npm ci

      - name: Firestore rules tests (emulator)
        run: npm test
