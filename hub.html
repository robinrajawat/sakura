<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sakura Hub</title>
<meta name="theme-color" content="#c2553d">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
<!--
  Sakura Hub — a separate, purpose-built mobile page. NOT a cut-down copy of index.html's
  code; a from-scratch, small implementation that happens to read/write the exact same
  localStorage keys and IndexedDB database/store as the main app, so nothing needs syncing
  between the two — opening either one always sees the other's latest changes, because
  there's only ever one copy of the data.

  Scope, deliberately: To-Dos and Journal only, and only their core actions (add, edit,
  complete, delete). Meeting Notes, Library, Recap, AI features, PDF export, and version
  history all stay desktop-only for now — see "Open full app" below for anyone who needs them
  from a phone anyway.

  Known limitation: if cloud sync (Settings → Account, sign in) is active, changes made here
  bump the same local-change timestamp index.html's sync engine checks (see
  bumpSyncTimestamp below), so the next time index.html is opened it correctly treats these
  edits as newer than the cloud copy and pushes them up. But this page itself never talks to
  Firebase — an edit made here and never followed by opening index.html again just stays
  local until it is.
-->
<style>
:root{--radius:10px}
*{box-sizing:border-box}
body.theme-light{color-scheme:light;--bg:#f8f8f6;--border:#e3e0d8;--fg:#3d3929;--muted:#73716b;--hint:#71716b;--accent:#c2553d;--hover:#f1f0ec;--sel:#eae8e2;--edit-bg:#ffffff;--chip:#eceae4;--fc-red:#c0392b;--fc-orange:#c2701d;--fc-green:#27824f;--fc-blue:#2766c2;--fc-gray:#6f6b63}
body.theme-dark{color-scheme:dark;--bg:#121212;--border:#2a2a27;--fg:#eae9e4;--muted:#9d9a93;--hint:#7d7b75;--accent:#d97757;--hover:#1d1d1a;--sel:#26241f;--edit-bg:#161614;--chip:#1d1d1a;--fc-red:#e08585;--fc-orange:#e0a868;--fc-green:#7fd9a6;--fc-blue:#82b4f0;--fc-gray:#a8a59d}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:calc(10px + env(safe-area-inset-top)) 14px 0}
#hub-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
#hub-title{font:700 15px/1 'Inter',sans-serif;letter-spacing:.02em;color:var(--fg)}
#hub-title span{color:var(--accent)}
#open-full-app{font-size:11.5px;color:var(--muted);text-decoration:none;white-space:nowrap;padding:5px 8px;border:1px solid var(--border);border-radius:999px}
#open-full-app:active{background:var(--hover)}
#hub-tabs{display:flex;gap:4px;padding-bottom:8px}
.hub-tab{flex:1;text-align:center;padding:9px 4px;border-radius:8px 8px 0 0;font:600 13px 'Inter',sans-serif;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent}
.hub-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
main{padding:14px;max-width:640px;margin:0 auto}
.hub-view{display:none}
.hub-view.active{display:block}
.hub-empty{color:var(--hint);font-size:13px;text-align:center;padding:28px 10px}

/* To-Dos */
#todo-add-row{display:flex;gap:8px;margin-bottom:14px}
#todo-add-input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--edit-bg);color:var(--fg);font-size:14px}
#todo-add-btn{width:40px;flex-shrink:0;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.todo-row{display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border)}
.todo-check{width:20px;height:20px;flex-shrink:0;margin-top:1px;border:1.5px solid var(--muted);border-radius:6px;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.todo-check.done{background:var(--accent);border-color:var(--accent);color:#fff}
.todo-main{flex:1;min-width:0}
.todo-text{width:100%;border:none;background:none;color:var(--fg);font-size:14px;font-family:inherit;padding:2px 0;line-height:1.4}
.todo-text.done{color:var(--hint);text-decoration:line-through}
.todo-meta{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap}
.todo-due{font-size:10.5px;color:var(--muted);background:var(--chip);border-radius:5px;padding:1px 6px}
.todo-due.overdue{color:var(--fc-red)}
.todo-del{border:none;background:none;color:var(--hint);font-size:16px;line-height:1;cursor:pointer;padding:2px 6px;flex-shrink:0}
#todo-completed-toggle{width:100%;text-align:left;background:none;border:none;color:var(--muted);font-size:12px;padding:12px 4px 6px;cursor:pointer}
#todo-completed-list{display:none}
#todo-completed-list.open{display:block}

/* Journal */
.jn-card{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--edit-bg)}
.jn-date{font:600 13px 'Inter',sans-serif;margin-bottom:8px}
.jn-moods{display:flex;gap:6px;margin-bottom:10px}
.jn-mood{flex:1;padding:6px 2px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--muted);font-size:11px;cursor:pointer}
.jn-mood.sel{color:#fff;border-color:transparent}
.jn-mood[data-mood="great"].sel{background:var(--fc-green)}
.jn-mood[data-mood="good"].sel{background:var(--fc-blue)}
.jn-mood[data-mood="neutral"].sel{background:var(--fc-gray)}
.jn-mood[data-mood="low"].sel{background:var(--fc-orange)}
.jn-mood[data-mood="rough"].sel{background:var(--fc-red)}
.jn-body{width:100%;min-height:90px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font:400 13.5px/1.6 inherit;padding:9px 11px;resize:vertical}
.jn-save-hint{font-size:10.5px;color:var(--hint);margin-top:6px;min-height:13px}
.jn-past-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.jn-past-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.jn-past-dot[data-mood="great"]{background:var(--fc-green)}
.jn-past-dot[data-mood="good"]{background:var(--fc-blue)}
.jn-past-dot[data-mood="neutral"]{background:var(--fc-gray)}
.jn-past-dot[data-mood="low"]{background:var(--fc-orange)}
.jn-past-dot[data-mood="rough"]{background:var(--fc-red)}
.jn-past-dot[data-mood=""]{background:var(--border)}
.jn-past-main{flex:1;min-width:0}
.jn-past-date{font:600 12px 'Inter',sans-serif}
.jn-past-preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jn-past-del{border:none;background:none;color:var(--hint);font-size:15px;cursor:pointer;padding:2px 6px}
</style>
</head>
<body>
<header>
  <div id="hub-title-row">
    <div id="hub-title">🌸 <span>SAKURA</span> Hub</div>
    <a href="#" id="open-full-app">Open full app →</a>
  </div>
  <div id="hub-tabs">
    <button class="hub-tab active" data-view="todos" id="tab-todos">To-Dos</button>
    <button class="hub-tab" data-view="journal" id="tab-journal">Journal</button>
  </div>
</header>
<main>
  <section id="view-todos" class="hub-view active">
    <div id="todo-add-row">
      <input id="todo-add-input" type="text" placeholder="Add a task…" maxlength="2000" autocomplete="off" />
      <button id="todo-add-btn" aria-label="Add task">+</button>
    </div>
    <div id="todo-open-list"></div>
    <div id="todo-open-empty" class="hub-empty" style="display:none">No open tasks — add one above.</div>
    <button id="todo-completed-toggle" type="button"></button>
    <div id="todo-completed-list"></div>
  </section>
  <section id="view-journal" class="hub-view">
    <div class="jn-card">
      <div class="jn-date" id="jn-today-date"></div>
      <div class="jn-moods" id="jn-today-moods"></div>
      <textarea class="jn-body" id="jn-today-body" placeholder="Write about today…"></textarea>
      <div class="jn-save-hint" id="jn-today-hint"></div>
    </div>
    <div id="jn-past-list"></div>
    <div id="jn-past-empty" class="hub-empty" style="display:none">No past entries yet.</div>
  </section>
</main>

<script>
// ============================================================================
// Theme — read the same preference index.html saves (Settings → Appearance),
// so this page doesn't look jarringly different from the app someone just left.
// Falls back to the OS-level preference if nothing's been saved yet.
// ============================================================================
(function applyTheme(){
  var theme='light';
  try{
    var raw=localStorage.getItem('sakura_v001_prefs');
    if(raw){
      var d=JSON.parse(raw);
      var map={default:'light',vscode:'dark','clever-dark':'dark',clever:'light',sakura:'light'};
      theme = d.theme ? (map[d.theme]||d.theme) : 'light';
      if(theme!=='light'&&theme!=='dark')theme='light';
    }else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
      theme='dark';
    }
  }catch(e){}
  document.body.className='theme-'+theme;
})();

// ============================================================================
// Storage layer — deliberately mirrors index.html's own key names, IndexedDB
// database/store, and data shapes exactly. This is the one part of this file
// that must never drift from index.html without updating both together.
// ============================================================================
var SAKURA_BACKUP_DB='sakura_backup_db', SAKURA_BACKUP_STORE='kv';
var TODOS_KEY='sakura_todos_v1';
var JOURNAL_KEY='sakura_journal_v1';
var SYNC_LOCAL_TS_KEY='sakura_sync_local_ts_v1';

var _idbConnPromise=null;
function idbOpen(){
  if(_idbConnPromise)return _idbConnPromise;
  _idbConnPromise=new Promise(function(resolve,reject){
    if(!('indexedDB' in window)){ _idbConnPromise=null; reject(new Error('no indexeddb')); return; }
    var req=indexedDB.open(SAKURA_BACKUP_DB,1);
    req.onupgradeneeded=function(){ var db=req.result; if(!db.objectStoreNames.contains(SAKURA_BACKUP_STORE))db.createObjectStore(SAKURA_BACKUP_STORE); };
    req.onsuccess=function(){ var db=req.result; db.onclose=function(){_idbConnPromise=null}; db.onversionchange=function(){db.close();_idbConnPromise=null}; resolve(db); };
    req.onerror=function(){ _idbConnPromise=null; reject(req.error); };
  });
  return _idbConnPromise;
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      var tx=db.transaction(SAKURA_BACKUP_STORE,'readonly');
      var req=tx.objectStore(SAKURA_BACKUP_STORE).get(key);
      req.onsuccess=function(){resolve(req.result)};
      req.onerror=function(){reject(req.error)};
    });
  });
}
function idbSet(key,value){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      var tx=db.transaction(SAKURA_BACKUP_STORE,'readwrite');
      tx.objectStore(SAKURA_BACKUP_STORE).put(value,key);
      tx.oncomplete=function(){resolve(true)};
      tx.onerror=function(){reject(tx.error)};
    });
  }).catch(function(){ return false; });
}
// Bumps the same local-change timestamp index.html's cloud sync engine reads (see
// markMetaChanged/_loadSyncLocalTs in index.html) — without this, a change made only here,
// on a device that's also signed in for cloud sync, could look "not newer than the cloud"
// the next time index.html runs its sync comparison and get silently overwritten by an
// older cloud copy. This page never pushes to Firestore itself; it just makes sure
// index.html knows to, next time it's open.
function bumpSyncTimestamp(metaKey){
  try{
    var raw=localStorage.getItem(SYNC_LOCAL_TS_KEY);
    var m=raw?JSON.parse(raw):{};
    m[metaKey]=Date.now();
    localStorage.setItem(SYNC_LOCAL_TS_KEY,JSON.stringify(m));
  }catch(e){}
}
function todoUid(){ return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function jnUid(){ return 'jn'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

// ============================================================================
// To-Dos — same shape as index.html's loadTodos()/saveTodos(). Loaded whole
// (every field, not just the ones this page edits) and written back whole, so
// fields only the desktop app understands (subtasks, link, nodeRef, meetingRef,
// repeat, priority, status) survive a round trip through this page untouched.
// ============================================================================
var todos=[];
var todoCompletedOpen=false;
function loadTodos(){
  try{
    var raw=localStorage.getItem(TODOS_KEY);
    var parsed=raw?JSON.parse(raw):[];
    todos=Array.isArray(parsed)?parsed:[];
  }catch(e){ todos=[]; }
}
function saveTodos(){
  try{
    localStorage.setItem(TODOS_KEY,JSON.stringify(todos));
    bumpSyncTimestamp('todos');
  }catch(e){
    alert("Could not save — your device storage may be full.");
  }
}
function newTodo(text){
  return {
    id:todoUid(), text:text, done:false, createdAt:Date.now(), completedAt:null,
    priority:'none', status:'none', dueDate:null, link:null, linkLabel:null,
    nodeRef:null, meetingRef:null, repeat:null, subtasks:[], subtasksOpen:true
  };
}
function renderTodos(){
  var openList=document.getElementById('todo-open-list');
  var openEmpty=document.getElementById('todo-open-empty');
  var doneList=document.getElementById('todo-completed-list');
  var doneToggle=document.getElementById('todo-completed-toggle');
  var open=todos.filter(function(t){return !t.done});
  var done=todos.filter(function(t){return t.done});
  openEmpty.style.display=open.length?'none':'';
  var today=todayStr();
  openList.innerHTML=open.map(function(t){
    var overdue=t.dueDate && t.dueDate<today;
    var dueChip=t.dueDate?'<span class="todo-due'+(overdue?' overdue':'')+'">'+esc(t.dueDate)+'</span>':'';
    return '<div class="todo-row" data-id="'+esc(t.id)+'">'
      +'<button class="todo-check" data-action="toggle" aria-label="Mark done"></button>'
      +'<div class="todo-main"><input class="todo-text" data-action="edit" value="'+esc(t.text)+'" />'
      +(dueChip?'<div class="todo-meta">'+dueChip+'</div>':'')
      +'</div>'
      +'<button class="todo-del" data-action="delete" aria-label="Delete task">×</button>'
      +'</div>';
  }).join('');
  doneToggle.textContent=(todoCompletedOpen?'▾ ':'▸ ')+'Completed ('+done.length+')';
  doneToggle.style.display=done.length?'':'none';
  doneList.className=todoCompletedOpen?'open':'';
  doneList.innerHTML=done.slice().sort(function(a,b){return (b.completedAt||0)-(a.completedAt||0)}).map(function(t){
    return '<div class="todo-row" data-id="'+esc(t.id)+'">'
      +'<button class="todo-check done" data-action="toggle" aria-label="Mark not done">✓</button>'
      +'<div class="todo-main"><span class="todo-text done">'+esc(t.text)+'</span></div>'
      +'<button class="todo-del" data-action="delete" aria-label="Delete task">×</button>'
      +'</div>';
  }).join('');
}
function findTodo(id){ return todos.find(function(t){return t.id===id}); }
document.getElementById('todo-add-btn').addEventListener('click',addTodoFromInput);
document.getElementById('todo-add-input').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addTodoFromInput(); } });
function addTodoFromInput(){
  var input=document.getElementById('todo-add-input');
  var text=input.value.trim();
  if(!text)return;
  todos.push(newTodo(text));
  input.value='';
  saveTodos(); renderTodos();
}
document.getElementById('todo-completed-toggle').addEventListener('click',function(){
  todoCompletedOpen=!todoCompletedOpen; renderTodos();
});
function todoListClick(e){
  var row=e.target.closest('.todo-row'); if(!row)return;
  var id=row.dataset.id; var t=findTodo(id); if(!t)return;
  var action=e.target.dataset.action;
  if(action==='toggle'){
    t.done=!t.done;
    t.completedAt=t.done?Date.now():null;
    saveTodos(); renderTodos();
  }else if(action==='delete'){
    if(!confirm('Delete this task?'))return;
    todos=todos.filter(function(x){return x.id!==id});
    saveTodos(); renderTodos();
  }
}
document.getElementById('todo-open-list').addEventListener('click',todoListClick);
document.getElementById('todo-completed-list').addEventListener('click',todoListClick);
document.getElementById('todo-open-list').addEventListener('change',function(e){
  if(e.target.dataset.action!=='edit')return;
  var row=e.target.closest('.todo-row'); var t=findTodo(row.dataset.id); if(!t)return;
  var val=e.target.value.trim();
  if(!val){ e.target.value=t.text; return; }
  t.text=val;
  saveTodos();
});

// ============================================================================
// Journal — same shape as index.html's normalizeJournalEntry()/loadJournalEntries()/
// saveJournalEntries(). Body is stored as plain text here (index.html's own rich-text
// editor renders it as HTML; a plain-text save from this page still displays fine there,
// just without formatting — this page never attempts rich text editing).
// ============================================================================
var JOURNAL_MOODS=['great','good','neutral','low','rough'];
var JOURNAL_MOOD_LABEL={great:'Great',good:'Good',neutral:'Neutral',low:'Low',rough:'Rough'};
var journalEntries=[];
var jnSaveTimer=null;
function normalizeJournalEntry(j){
  var now=Date.now();
  return {
    id:(j&&typeof j.id==='string')?j.id:jnUid(),
    date:(j&&typeof j.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(j.date))?j.date:todayStr(),
    mood:(j&&JOURNAL_MOODS.indexOf(j.mood)!==-1)?j.mood:'',
    tags:(j&&Array.isArray(j.tags))?j.tags:[],
    body:(j&&typeof j.body==='string')?j.body:'',
    createdAt:(j&&isFinite(j.createdAt))?j.createdAt:now,
    modifiedAt:(j&&isFinite(j.modifiedAt))?j.modifiedAt:now
  };
}
function loadJournalEntries(){
  return idbGet(JOURNAL_KEY).then(function(idbEntries){
    if(Array.isArray(idbEntries)){ journalEntries=idbEntries.map(normalizeJournalEntry); return; }
    // Legacy localStorage fallback, same one-time migration index.html itself does.
    try{
      var raw=localStorage.getItem(JOURNAL_KEY);
      if(raw){
        var data=JSON.parse(raw);
        if(Array.isArray(data)){
          journalEntries=data.map(normalizeJournalEntry);
          idbSet(JOURNAL_KEY,journalEntries);
          localStorage.removeItem(JOURNAL_KEY);
        }
      }
    }catch(e){}
  }).catch(function(){ journalEntries=[]; });
}
function saveJournalEntries(){
  idbSet(JOURNAL_KEY,journalEntries).then(function(ok){
    if(ok){ bumpSyncTimestamp('journal'); }
    else{ document.getElementById('jn-today-hint').textContent='Storage full — this change was not saved.'; }
  });
}
function findJournalEntry(date){ return journalEntries.find(function(j){return j.date===date}); }
function formatJournalDateLabel(dateStr){
  var d=new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
}
function renderJournalToday(){
  var date=todayStr();
  var entry=findJournalEntry(date)||normalizeJournalEntry({date:date});
  document.getElementById('jn-today-date').textContent=formatJournalDateLabel(date)+' · Today';
  document.getElementById('jn-today-moods').innerHTML=JOURNAL_MOODS.map(function(m){
    return '<button type="button" class="jn-mood'+(entry.mood===m?' sel':'')+'" data-mood="'+m+'">'+JOURNAL_MOOD_LABEL[m]+'</button>';
  }).join('');
  document.getElementById('jn-today-body').value=entry.body;
}
document.getElementById('jn-today-moods').addEventListener('click',function(e){
  var btn=e.target.closest('.jn-mood'); if(!btn)return;
  var date=todayStr();
  var mood=btn.dataset.mood;
  var entry=findJournalEntry(date);
  var body=document.getElementById('jn-today-body').value;
  if(!entry){
    if(!body.trim() && !mood)return; // nothing to create yet
    entry=normalizeJournalEntry({date:date}); journalEntries.push(entry);
  }
  entry.mood = entry.mood===mood ? '' : mood; // tap the same mood again to clear it
  entry.modifiedAt=Date.now();
  if(!entry.body.trim() && !entry.mood){
    journalEntries=journalEntries.filter(function(j){return j.id!==entry.id});
  }
  saveJournalEntries(); renderJournalToday(); renderJournalPast();
});
document.getElementById('jn-today-body').addEventListener('input',function(e){
  clearTimeout(jnSaveTimer);
  var hint=document.getElementById('jn-today-hint');
  hint.textContent='Saving…';
  jnSaveTimer=setTimeout(function(){
    var date=todayStr();
    var body=e.target.value;
    var entry=findJournalEntry(date);
    if(!entry){
      if(!body.trim())return;
      entry=normalizeJournalEntry({date:date}); journalEntries.push(entry);
    }
    entry.body=body;
    entry.modifiedAt=Date.now();
    if(!entry.body.trim() && !entry.mood){
      journalEntries=journalEntries.filter(function(j){return j.id!==entry.id});
    }
    saveJournalEntries();
    hint.textContent='Saved';
    renderJournalPast();
  },500);
});
function renderJournalPast(){
  var list=document.getElementById('jn-past-list');
  var empty=document.getElementById('jn-past-empty');
  var today=todayStr();
  var past=journalEntries.filter(function(j){return j.date!==today}).sort(function(a,b){return b.date.localeCompare(a.date)});
  empty.style.display=past.length?'none':'';
  list.innerHTML=past.map(function(j){
    var preview=(j.body||'').replace(/\s+/g,' ').trim().slice(0,80)||'(no notes)';
    return '<div class="jn-past-row" data-id="'+esc(j.id)+'">'
      +'<span class="jn-past-dot" data-mood="'+esc(j.mood)+'"></span>'
      +'<div class="jn-past-main"><div class="jn-past-date">'+esc(formatJournalDateLabel(j.date))+'</div>'
      +'<div class="jn-past-preview">'+esc(preview)+'</div></div>'
      +'<button class="jn-past-del" data-action="delete" aria-label="Delete entry">×</button>'
      +'</div>';
  }).join('');
}
document.getElementById('jn-past-list').addEventListener('click',function(e){
  var row=e.target.closest('.jn-past-row'); if(!row)return;
  var id=row.dataset.id;
  var entry=journalEntries.find(function(j){return j.id===id}); if(!entry)return;
  if(e.target.dataset.action==='delete'){
    if(!confirm('Delete the journal entry for '+formatJournalDateLabel(entry.date)+'?'))return;
    journalEntries=journalEntries.filter(function(j){return j.id!==id});
    saveJournalEntries(); renderJournalPast();
    return;
  }
  var newBody=prompt(formatJournalDateLabel(entry.date), entry.body);
  if(newBody===null)return;
  entry.body=newBody; entry.modifiedAt=Date.now();
  saveJournalEntries(); renderJournalPast();
});

// ============================================================================
// Tabs & boot
// ============================================================================
document.getElementById('hub-tabs').addEventListener('click',function(e){
  var btn=e.target.closest('.hub-tab'); if(!btn)return;
  document.querySelectorAll('.hub-tab').forEach(function(b){b.classList.toggle('active',b===btn)});
  var view=btn.dataset.view;
  document.querySelectorAll('.hub-view').forEach(function(v){v.classList.toggle('active',v.id==='view-'+view)});
});
document.getElementById('open-full-app').addEventListener('click',function(e){
  e.preventDefault();
  try{ sessionStorage.setItem('sakura_skip_mobile_redirect','true'); }catch(err){}
  window.location.href='index.html';
});

loadTodos();
renderTodos();
loadJournalEntries().then(function(){
  renderJournalToday();
  renderJournalPast();
});
</script>
</body>
</html>
