<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sakura Hub</title>
<meta name="theme-color" content="#c2553d">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.googleapis.com https://accounts.google.com https://oauth2.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://sakura-4cdae.firebaseapp.com https://apis.google.com https://firestore.googleapis.com; frame-src https://accounts.google.com https://sakura-4cdae.firebaseapp.com https://apis.google.com; object-src 'none'; base-uri 'self'; form-action 'self';">
<link rel="preconnect" href="https://fonts.googleapis.com">

<!--
  Sakura Hub — a separate, purpose-built mobile page. NOT a cut-down copy of index.html's
  code; a from-scratch, small implementation.

  ACCOUNTS ARE REQUIRED HERE, unlike index.html. This page only exists to be opened on a
  phone — a different browser from whatever desktop/laptop the person normally uses — and a
  phone's local storage starts out completely empty and disconnected from that desktop's
  data no matter how identical the two pages' storage code is. Local storage never crosses
  devices; only a signed-in account (synced through the exact same users/{uid}/meta/todos and
  users/{uid}/meta/journal Firestore documents index.html's own cloud sync already writes)
  actually bridges them. So: no sign-in, no data, by design — there is no useful local-only
  mode for a page whose entire reason to exist is showing you data that almost certainly
  lives on a different device's storage right now.

  Sync model, deliberately simple for this scope: pull once on sign-in (newer of cloud/local
  wins, by updatedAt), then push after every local change. No realtime listener — this is a
  short-session mobile page, not something left open for hours the way index.html can be.

  Scope, deliberately: To-Dos and Journal only, and only their core actions (add, edit,
  complete, delete). Meeting Notes, Library, Recap, AI features, PDF export, and version
  history all stay desktop-only for now — see "Open full app" for anyone who needs them.
-->
<style>
:root{--radius:10px}
*{box-sizing:border-box}
body.theme-light{color-scheme:light;--bg:#f8f8f6;--border:#e3e0d8;--fg:#3d3929;--muted:#73716b;--hint:#71716b;--accent:#c2553d;--hover:#f1f0ec;--sel:#eae8e2;--edit-bg:#ffffff;--chip:#eceae4;--fc-red:#c0392b;--fc-orange:#c2701d;--fc-green:#27824f;--fc-blue:#2766c2;--fc-gray:#6f6b63}
body.theme-dark{color-scheme:dark;--bg:#121212;--border:#2a2a27;--fg:#eae9e4;--muted:#9d9a93;--hint:#7d7b75;--accent:#d97757;--hover:#1d1d1a;--sel:#26241f;--edit-bg:#161614;--chip:#1d1d1a;--fc-red:#e08585;--fc-orange:#e0a868;--fc-green:#7fd9a6;--fc-blue:#82b4f0;--fc-gray:#a8a59d}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.5 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:calc(10px + env(safe-area-inset-top)) 14px 0}
#hub-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
#hub-brand{display:flex;align-items:center;gap:8px}
#hub-brand img{width:24px;height:24px;border-radius:7px;display:block}
#hub-title{font:700 15px/1 'Inter',sans-serif;letter-spacing:.03em;color:var(--fg)}
#account-btn{width:32px;height:32px;border-radius:50%;border:none;padding:0;cursor:pointer;background:var(--accent);color:#fff;font:600 13px 'Inter',sans-serif;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;position:relative}
#account-btn img{width:100%;height:100%;object-fit:cover;display:block}
#account-menu-wrap{position:relative}
#account-dropdown{display:none;position:absolute;top:calc(100% + 8px);right:0;width:220px;background:var(--edit-bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:12px;z-index:20}
#account-dropdown.open{display:block}
#account-dropdown-name{font:600 13px 'Inter',sans-serif;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#account-dropdown-email{font-size:11.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#account-dropdown-divider{height:1px;background:var(--border);margin:10px 0}
#account-signout-btn{width:100%;text-align:left;background:none;border:none;color:#c0392b;font:500 13px 'Inter',sans-serif;padding:7px 2px;cursor:pointer;border-radius:6px}
#account-signout-btn:active{background:var(--hover)}
#hub-tabs{display:flex;gap:4px;padding-bottom:8px}
.hub-tab{flex:1;text-align:center;padding:9px 4px;border-radius:8px 8px 0 0;font:600 13px 'Inter',sans-serif;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent}
.hub-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
main{padding:14px;max-width:640px;margin:0 auto}
.hub-view{display:none}
.hub-view.active{display:block;animation:hub-fade-in .18s ease}
@keyframes hub-fade-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.hub-empty{color:var(--hint);font-size:13px;text-align:center;padding:28px 10px}

/* Reusable modal + toast, replacing native confirm()/prompt()/alert() — those look like the
   browser interrupted you; these look like part of the app. */
.hub-modal-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center;padding:0}
.hub-modal-overlay.open{display:flex}
.hub-modal{width:100%;max-width:480px;background:var(--edit-bg);border-radius:16px 16px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 28px rgba(0,0,0,.18);animation:hub-modal-up .2s ease}
@media (min-width:520px){.hub-modal-overlay{align-items:center;padding:24px}.hub-modal{border-radius:16px}}
@keyframes hub-modal-up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.hub-modal-title{font:700 15px 'Inter',sans-serif;margin-bottom:6px}
.hub-modal-body{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:18px}
.hub-modal-actions{display:flex;gap:10px}
.hub-modal-btn{flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);background:none;color:var(--fg);font:600 13.5px 'Inter',sans-serif;cursor:pointer}
.hub-modal-btn.danger{background:#c0392b;border-color:#c0392b;color:#fff}
.hub-modal-btn:active{opacity:.75}
#hub-toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--fg);color:var(--bg);font:500 12.5px 'Inter',sans-serif;padding:9px 16px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:200;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease}
#hub-toast.show{opacity:1;transform:translate(-50%,0)}
#hub-app{display:none}

/* Auth gate */
#auth-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#auth-card{width:100%;max-width:360px;text-align:center}
#auth-logo{margin-bottom:12px}
#auth-logo img{width:52px;height:52px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
#auth-title{font:700 18px 'Inter',sans-serif;margin-bottom:6px}
#auth-sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.6}
#auth-google-btn{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;background:var(--edit-bg);color:var(--fg);font:500 13.5px 'Inter',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
#auth-google-btn:active{background:var(--hover)}
#auth-divider{display:flex;align-items:center;gap:8px;margin:16px 0;color:var(--muted);font-size:10.5px}
#auth-divider span{flex:1;height:1px;background:var(--border)}
#auth-email-toggle{background:none;border:1px solid var(--border);border-radius:9px;color:var(--accent);width:100%;padding:10px;cursor:pointer;font:500 13px 'Inter',sans-serif}
#auth-email-form{display:none;margin-top:12px;text-align:left}
#auth-email-form input{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--edit-bg);color:var(--fg);font-size:13px;margin-bottom:8px;font-family:inherit}
#auth-email-submit{width:100%;padding:10px;border:none;border-radius:9px;background:var(--accent);color:#fff;font:600 13px 'Inter',sans-serif;cursor:pointer}
#auth-email-error{color:var(--fc-red);font-size:12px;margin-bottom:8px;display:none}
#auth-email-mode-toggle,#auth-email-forgot{background:none;border:none;color:var(--muted);font-size:10.5px;cursor:pointer;padding:0;font-family:inherit}
#auth-email-links{display:flex;justify-content:space-between;margin-top:8px;gap:8px}
#auth-status{font-size:12px;color:var(--muted);margin-top:16px;min-height:15px}

/* To-Dos */
#todo-add-row{display:flex;gap:8px;margin-bottom:14px}
#todo-add-input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--edit-bg);color:var(--fg);font-size:14px}
#todo-add-btn{width:40px;flex-shrink:0;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.todo-row{display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border)}
.todo-check{width:20px;height:20px;flex-shrink:0;margin-top:1px;border:1.5px solid var(--muted);border-radius:6px;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.todo-check.done{background:var(--accent);border-color:var(--accent);color:#fff}
.todo-main{flex:1;min-width:0}
.todo-text{width:100%;border:none;background:none;color:var(--fg);font-size:14px;font-family:inherit;padding:2px 0;line-height:1.4}
.todo-text.done{color:var(--hint);text-decoration:line-through}
.todo-meta{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap}
.todo-due{font-size:10.5px;color:var(--muted);background:var(--chip);border-radius:5px;padding:1px 6px}
.todo-due.overdue{color:var(--fc-red)}
.todo-del{border:none;background:none;color:var(--hint);font-size:16px;line-height:1;cursor:pointer;padding:2px 6px;flex-shrink:0}
#todo-completed-toggle{width:100%;text-align:left;background:none;border:none;color:var(--muted);font-size:12px;padding:12px 4px 6px;cursor:pointer}
#todo-completed-list{display:none}
#todo-completed-list.open{display:block}

/* Journal */
.jn-card{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--edit-bg)}
.jn-date{font:600 13px 'Inter',sans-serif;margin-bottom:8px}
.jn-moods{display:flex;gap:6px;margin-bottom:10px}
.jn-mood{flex:1;padding:6px 2px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--muted);font-size:11px;cursor:pointer}
.jn-mood.sel{color:#fff;border-color:transparent}
.jn-mood[data-mood="great"].sel{background:var(--fc-green)}
.jn-mood[data-mood="good"].sel{background:var(--fc-blue)}
.jn-mood[data-mood="neutral"].sel{background:var(--fc-gray)}
.jn-mood[data-mood="low"].sel{background:var(--fc-orange)}
.jn-mood[data-mood="rough"].sel{background:var(--fc-red)}
.jn-body{width:100%;min-height:90px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font:400 13.5px/1.6 inherit;padding:9px 11px;resize:vertical}
.jn-save-hint{font-size:10.5px;color:var(--hint);margin-top:6px;min-height:13px}
.jn-past-item{border-bottom:1px solid var(--border)}
.jn-past-row{display:flex;align-items:center;gap:10px;padding:10px 4px;cursor:pointer}
.jn-past-chevron{color:var(--hint);flex-shrink:0;transition:transform .15s ease}
.jn-past-item.open .jn-past-chevron{transform:rotate(90deg)}
.jn-past-edit{display:none;padding:2px 4px 14px 22px}
.jn-past-item.open .jn-past-edit{display:block;animation:hub-fade-in .16s ease}
.jn-past-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.jn-past-dot[data-mood="great"]{background:var(--fc-green)}
.jn-past-dot[data-mood="good"]{background:var(--fc-blue)}
.jn-past-dot[data-mood="neutral"]{background:var(--fc-gray)}
.jn-past-dot[data-mood="low"]{background:var(--fc-orange)}
.jn-past-dot[data-mood="rough"]{background:var(--fc-red)}
.jn-past-dot[data-mood=""]{background:var(--border)}
.jn-past-main{flex:1;min-width:0}
.jn-past-date{font:600 12px 'Inter',sans-serif}
.jn-past-preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jn-past-del{border:none;background:none;color:var(--hint);font-size:15px;cursor:pointer;padding:2px 6px}
</style>
</head>
<body>

<div id="auth-gate">
  <div id="auth-card">
    <div id="auth-logo"><img src="icon-192.png" alt="Sakura" width="52" height="52"></div>
    <div id="auth-title">Sign in to Sakura Hub</div>
    <div id="auth-sub">This page needs your account to find your To-Dos and Journal — they live on your other device until you sign in here too.</div>
    <button id="auth-google-btn" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Sign in with Google
    </button>
    <div id="auth-divider"><span></span>or<span></span></div>
    <button id="auth-email-toggle" type="button">Sign in with email</button>
    <div id="auth-email-form">
      <input id="auth-email-input" type="email" placeholder="Email" autocomplete="email" />
      <input id="auth-password-input" type="password" placeholder="Password" autocomplete="current-password" />
      <div id="auth-email-error"></div>
      <button id="auth-email-submit" type="button">Sign in</button>
      <div id="auth-email-links">
        <button id="auth-email-mode-toggle" type="button">New here? Create an account</button>
        <button id="auth-email-forgot" type="button">Forgot password?</button>
      </div>
    </div>
    <div id="auth-status"></div>
  </div>
</div>

<div id="hub-app">
<header>
  <div id="hub-title-row">
    <div id="hub-brand"><img src="icon-192.png" alt="" width="24" height="24"><div id="hub-title">Sakura Hub</div></div>
    <div id="account-menu-wrap">
      <button id="account-btn" type="button" aria-label="Account" aria-haspopup="true" aria-expanded="false"></button>
      <div id="account-dropdown">
        <div id="account-dropdown-name"></div>
        <div id="account-dropdown-email"></div>
        <div id="account-dropdown-divider"></div>
        <button id="account-signout-btn" type="button">Sign out</button>
      </div>
    </div>
  </div>
  <div id="hub-tabs">
    <button class="hub-tab active" data-view="todos" id="tab-todos">To-Dos</button>
    <button class="hub-tab" data-view="journal" id="tab-journal">Journal</button>
  </div>
</header>
<main>
  <section id="view-todos" class="hub-view active">
    <div id="todo-add-row">
      <input id="todo-add-input" type="text" placeholder="Add a task…" maxlength="2000" autocomplete="off" />
      <button id="todo-add-btn" aria-label="Add task">+</button>
    </div>
    <div id="todo-open-list"></div>
    <div id="todo-open-empty" class="hub-empty" style="display:none">No open tasks — add one above.</div>
    <button id="todo-completed-toggle" type="button"></button>
    <div id="todo-completed-list"></div>
  </section>
  <section id="view-journal" class="hub-view">
    <div class="jn-card">
      <div class="jn-date" id="jn-today-date"></div>
      <div class="jn-moods" id="jn-today-moods"></div>
      <textarea class="jn-body" id="jn-today-body" placeholder="Write about today…"></textarea>
      <div class="jn-save-hint" id="jn-today-hint"></div>
    </div>
    <div id="jn-past-list"></div>
    <div id="jn-past-empty" class="hub-empty" style="display:none">No past entries yet.</div>
  </section>
</main>
</div>

<div id="hub-confirm-overlay" class="hub-modal-overlay" role="dialog" aria-modal="true">
  <div class="hub-modal">
    <div class="hub-modal-title" id="hub-confirm-title"></div>
    <div class="hub-modal-body" id="hub-confirm-body"></div>
    <div class="hub-modal-actions">
      <button class="hub-modal-btn" id="hub-confirm-cancel" type="button">Cancel</button>
      <button class="hub-modal-btn danger" id="hub-confirm-ok" type="button">Delete</button>
    </div>
  </div>
</div>
<div id="hub-toast"></div>

<script>
// ============================================================================
// Theme — read the same preference index.html saves (Settings → Appearance),
// so this page doesn't look jarringly different from the app someone just left.
// ============================================================================
(function applyTheme(){
  var theme='light';
  try{
    var raw=localStorage.getItem('sakura_v001_prefs');
    if(raw){
      var d=JSON.parse(raw);
      var map={default:'light',vscode:'dark','clever-dark':'dark',clever:'light',sakura:'light'};
      theme = d.theme ? (map[d.theme]||d.theme) : 'light';
      if(theme!=='light'&&theme!=='dark')theme='light';
    }else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
      theme='dark';
    }
  }catch(e){}
  document.body.className='theme-'+theme;
})();
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

// ============================================================================
// UI helpers — a styled confirm modal and toast in place of the browser's own
// confirm()/alert(), which look and feel like an interruption rather than part
// of the app, especially on mobile.
// ============================================================================
var _confirmResolve=null;
function hubConfirm(title,body,confirmLabel){
  document.getElementById('hub-confirm-title').textContent=title;
  document.getElementById('hub-confirm-body').textContent=body;
  document.getElementById('hub-confirm-ok').textContent=confirmLabel||'Delete';
  document.getElementById('hub-confirm-overlay').classList.add('open');
  return new Promise(function(resolve){ _confirmResolve=resolve; });
}
function _closeHubConfirm(result){
  document.getElementById('hub-confirm-overlay').classList.remove('open');
  if(_confirmResolve){ _confirmResolve(result); _confirmResolve=null; }
}
document.getElementById('hub-confirm-ok').addEventListener('click',function(){ _closeHubConfirm(true); });
document.getElementById('hub-confirm-cancel').addEventListener('click',function(){ _closeHubConfirm(false); });
document.getElementById('hub-confirm-overlay').addEventListener('click',function(e){
  if(e.target.id==='hub-confirm-overlay')_closeHubConfirm(false);
});
var _toastTimer=null;
function showToast(msg){
  var t=document.getElementById('hub-toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(function(){ t.classList.remove('show'); },2200);
}

// ============================================================================
// Firebase — same config/SDK version/lazy-load pattern as index.html, so this
// is still one Firebase project, one set of users, one set of data either page
// can read. Nothing here loads until sign-in is actually attempted, or a prior
// session on this device is being silently restored (sakura_account_active).
// ============================================================================
var FIREBASE_CONFIG={apiKey:"AIzaSyB0WitU2dazVbt_MCkkxZuL_pxSH76Xlj0",authDomain:"sakura-4cdae.firebaseapp.com",projectId:"sakura-4cdae",storageBucket:"sakura-4cdae.firebasestorage.app",messagingSenderId:"547935562547",appId:"1:547935562547:web:50ddb56ab0db0089452c46",measurementId:"G-KSBVB732SJ"};
var FIREBASE_SDK_VERSION="10.14.1";
var currentUser=null;
var _firebaseModsPromise=null;
function loadFirebaseMods(){
  if(_firebaseModsPromise)return _firebaseModsPromise;
  _firebaseModsPromise=Promise.all([
    import('https://www.gstatic.com/firebasejs/'+FIREBASE_SDK_VERSION+'/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/'+FIREBASE_SDK_VERSION+'/firebase-auth.js')
  ]).then(function(mods){
    var app=mods[0].initializeApp(FIREBASE_CONFIG);
    var auth=mods[1].getAuth(app);
    return {app:app,auth:auth,authMod:mods[1]};
  });
  return _firebaseModsPromise;
}
var _firestoreModsPromise=null;
function loadFirestoreMods(){
  if(_firestoreModsPromise)return _firestoreModsPromise;
  _firestoreModsPromise=Promise.all([
    import('https://www.gstatic.com/firebasejs/'+FIREBASE_SDK_VERSION+'/firebase-firestore.js'),
    loadFirebaseMods()
  ]).then(function(res){
    var db=res[0].getFirestore(res[1].app);
    return {mod:res[0],db:db};
  });
  return _firestoreModsPromise;
}
function emailAuthErrorMessage(e){

    'auth/user-not-found':'No account found for that email.',
    'auth/wrong-password':'Incorrect password.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/email-already-in-use':'An account already exists for that email — try signing in instead.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/missing-password':'Enter a password.',

    'auth/network-request-failed':'Network error — check your connection and try again.',

// Silently restores a previous session on load — but only if this exact device has signed
// in before (same flag index.html itself sets/checks), so a phone that's never been used
// for this before pays zero Firebase cost and lands straight on the sign-in gate instead of
// waiting on a network round-trip it already knows will fail.
function boot(){
  var wasActive=false;
  try{ wasActive=localStorage.getItem('sakura_account_active')==='true'; }catch(e){}
  if(!wasActive)return; // sign-in gate is already the default visible state — nothing more to do
  setAuthStatus('Signing in…');
  loadFirebaseMods().then(function(f){
    f.authMod.onAuthStateChanged(f.auth,function(user){
      if(user){ onSignedIn(user); }
      else{
        try{ localStorage.removeItem('sakura_account_active'); }catch(e){}
        setAuthStatus('');
      }
    });
  }).catch(function(){ setAuthStatus('Could not reach your account — check your connection and try again.'); });
}

// ============================================================================
// Storage layer — mirrors index.html's own key names, IndexedDB database/store,
// and data shapes exactly for local caching, PLUS pushes/pulls the same
// users/{uid}/meta/{todos,journal} Firestore docs index.html's cloud sync uses.
// This dual layer (local cache + cloud source of truth) is what makes this
// page actually useful across devices instead of just matching a schema.
// ============================================================================
var SAKURA_BACKUP_DB='sakura_backup_db', SAKURA_BACKUP_STORE='kv';
var TODOS_KEY='sakura_todos_v1';
var JOURNAL_KEY='sakura_journal_v1';
var SYNC_LOCAL_TS_KEY='sakura_sync_local_ts_v1';

var _idbConnPromise=null;
function idbOpen(){
  if(_idbConnPromise)return _idbConnPromise;
  _idbConnPromise=new Promise(function(resolve,reject){
    if(!('indexedDB' in window)){ _idbConnPromise=null; reject(new Error('no indexeddb')); return; }
    var req=indexedDB.open(SAKURA_BACKUP_DB,1);
    req.onupgradeneeded=function(){ var db=req.result; if(!db.objectStoreNames.contains(SAKURA_BACKUP_STORE))db.createObjectStore(SAKURA_BACKUP_STORE); };
    req.onsuccess=function(){ var db=req.result; db.onclose=function(){_idbConnPromise=null}; db.onversionchange=function(){db.close();_idbConnPromise=null}; resolve(db); };
    req.onerror=function(){ _idbConnPromise=null; reject(req.error); };
  });
  return _idbConnPromise;
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      var tx=db.transaction(SAKURA_BACKUP_STORE,'readonly');
      var req=tx.objectStore(SAKURA_BACKUP_STORE).get(key);
      req.onsuccess=function(){resolve(req.result)};
      req.onerror=function(){reject(req.error)};
    });
  });
}
function idbSet(key,value){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      var tx=db.transaction(SAKURA_BACKUP_STORE,'readwrite');
      tx.objectStore(SAKURA_BACKUP_STORE).put(value,key);
      tx.oncomplete=function(){resolve(true)};
      tx.onerror=function(){reject(tx.error)};
    });
  }).catch(function(){ return false; });
}
function loadSyncLocalTs(){ try{ var r=localStorage.getItem(SYNC_LOCAL_TS_KEY); return r?JSON.parse(r):{}; }catch(e){ return {}; } }
function saveSyncLocalTs(m){ try{ localStorage.setItem(SYNC_LOCAL_TS_KEY,JSON.stringify(m)); }catch(e){} }
function bumpSyncTimestamp(metaKey){ var m=loadSyncLocalTs(); m[metaKey]=Date.now(); saveSyncLocalTs(m); }
// Best-effort direct push to Firestore, same shape as index.html's pushMetaToCloud
// (users/{uid}/meta/{key} = {value, updatedAt}). Failures (offline, etc.) are silent here —
// the local copy (already saved before this is called) stays the safe fallback, and the
// bumped local timestamp means index.html's own sync will pick this change up and push it
// properly the next time that's open, same as any other locally-made-while-offline edit.
function pushMetaToCloud(metaKey,value){
  if(!currentUser)return;
  var ts=Date.now();
  loadFirestoreMods().then(function(f){
    return f.mod.setDoc(f.mod.doc(f.db,'users',currentUser.uid,'meta',metaKey),{value:value,updatedAt:ts});
  }).catch(function(e){ console.warn('[sakura hub] cloud push failed for',metaKey,e); });
}
// Pulls users/{uid}/meta/{key}; newer of cloud vs. this device's own last-known-changed
// timestamp wins (mirrors index.html's own pull/merge comparison, simplified to a single
// per-key decision instead of the fuller multi-collection reconciliation index.html does).
function pullMetaFromCloud(metaKey){
  if(!currentUser)return Promise.resolve(undefined);
  return loadFirestoreMods().then(function(f){
    return f.mod.getDoc(f.mod.doc(f.db,'users',currentUser.uid,'meta',metaKey));
  }).then(function(snap){
    if(!snap.exists())return undefined;
    var cloud=snap.data();
    var localTs=Number(loadSyncLocalTs()[metaKey])||0;
    var cloudTs=Number(cloud.updatedAt)||0;
    if(cloudTs>localTs)return cloud.value;
    return undefined; // local is at least as new — keep what's already here, and it'll get pushed below
  }).catch(function(e){ console.warn('[sakura hub] cloud pull failed for',metaKey,e); return undefined; });
}
function todoUid(){ return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function jnUid(){ return 'jn'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// ============================================================================
// To-Dos — same shape as index.html's loadTodos()/saveTodos(). Loaded whole
// (every field, not just the ones this page edits) and written back whole, so
// fields only the desktop app understands (subtasks, link, nodeRef, meetingRef,
// repeat, priority, status) survive a round trip through this page untouched.
// ============================================================================
var todos=[];
var todoCompletedOpen=false;
function loadTodosLocal(){
  try{
    var raw=localStorage.getItem(TODOS_KEY);
    var parsed=raw?JSON.parse(raw):[];
    todos=Array.isArray(parsed)?parsed:[];
  }catch(e){ todos=[]; }
}
function saveTodos(){
  try{
    localStorage.setItem(TODOS_KEY,JSON.stringify(todos));
    bumpSyncTimestamp('todos');
    pushMetaToCloud('todos',todos);
  }catch(e){
    showToast('Could not save — your device storage may be full.');
  }
}
function newTodo(text){
  return {
    id:todoUid(), text:text, done:false, createdAt:Date.now(), completedAt:null,
    priority:'none', status:'none', dueDate:null, link:null, linkLabel:null,
    nodeRef:null, meetingRef:null, repeat:null, subtasks:[], subtasksOpen:true
  };
}
function renderTodos(){
  var openList=document.getElementById('todo-open-list');
  var openEmpty=document.getElementById('todo-open-empty');
  var doneList=document.getElementById('todo-completed-list');
  var doneToggle=document.getElementById('todo-completed-toggle');
  var open=todos.filter(function(t){return !t.done});
  var done=todos.filter(function(t){return t.done});
  openEmpty.style.display=open.length?'none':'';
  var today=todayStr();
  openList.innerHTML=open.map(function(t){
    var overdue=t.dueDate && t.dueDate<today;
    var dueChip=t.dueDate?'<span class="todo-due'+(overdue?' overdue':'')+'">'+esc(t.dueDate)+'</span>':'';

      +'<button class="todo-check" data-action="toggle" aria-label="Mark done"></button>'
      +'<div class="todo-main"><input class="todo-text" data-action="edit" value="'+esc(t.text)+'" />'
      +(dueChip?'<div class="todo-meta">'+dueChip+'</div>':'')
      +'</div>'
      +'<button class="todo-del" data-action="delete" aria-label="Delete task">×</button>'
      +'</div>';
  }).join('');
  doneToggle.textContent=(todoCompletedOpen?'▾ ':'▸ ')+'Completed ('+done.length+')';
  doneToggle.style.display=done.length?'':'none';
  doneList.className=todoCompletedOpen?'open':'';
  doneList.innerHTML=done.slice().sort(function(a,b){return (b.completedAt||0)-(a.completedAt||0)}).map(function(t){
    return '<div class="todo-row" data-id="'+esc(t.id)+'">'
      +'<button class="todo-check done" data-action="toggle" aria-label="Mark not done">✓</button>'
      +'<div class="todo-main"><span class="todo-text done">'+esc(t.text)+'</span></div>'
      +'<button class="todo-del" data-action="delete" aria-label="Delete task">×</button>'
      +'</div>';
  }).join('');
}
function findTodo(id){ return todos.find(function(t){return t.id===id}); }

// ============================================================================
// Journal — same shape as index.html's normalizeJournalEntry()/loadJournalEntries()/
// saveJournalEntries(). Body is stored as plain text here (index.html's own rich-text
// editor renders it as HTML; a plain-text save from this page still displays fine there,
// just without formatting — this page never attempts rich text editing).
// ============================================================================
var JOURNAL_MOODS=['great','good','neutral','low','rough'];
var JOURNAL_MOOD_LABEL={great:'Great',good:'Good',neutral:'Neutral',low:'Low',rough:'Rough'};
var journalEntries=[];
var jnSaveTimer=null;
function normalizeJournalEntry(j){
  var now=Date.now();
  return {
    id:(j&&typeof j.id==='string')?j.id:jnUid(),
    date:(j&&typeof j.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(j.date))?j.date:todayStr(),
    mood:(j&&JOURNAL_MOODS.indexOf(j.mood)!==-1)?j.mood:'',
    tags:(j&&Array.isArray(j.tags))?j.tags:[],
    body:(j&&typeof j.body==='string')?j.body:'',
    createdAt:(j&&isFinite(j.createdAt))?j.createdAt:now,
    modifiedAt:(j&&isFinite(j.modifiedAt))?j.modifiedAt:now
  };
}
function loadJournalLocal(){
  return idbGet(JOURNAL_KEY).then(function(idbEntries){
    if(Array.isArray(idbEntries)){ journalEntries=idbEntries.map(normalizeJournalEntry); return; }
    try{
      var raw=localStorage.getItem(JOURNAL_KEY);
      if(raw){
        var data=JSON.parse(raw);
        if(Array.isArray(data)){
          journalEntries=data.map(normalizeJournalEntry);
          idbSet(JOURNAL_KEY,journalEntries);
          localStorage.removeItem(JOURNAL_KEY);
        }
      }
    }catch(e){}
  }).catch(function(){ journalEntries=[]; });
}
function saveJournalEntries(){
  idbSet(JOURNAL_KEY,journalEntries).then(function(ok){
    if(ok){ bumpSyncTimestamp('journal'); pushMetaToCloud('journal',journalEntries); }
    else{ document.getElementById('jn-today-hint').textContent='Storage full — this change was not saved.'; }
  });
}
function findJournalEntry(date){ return journalEntries.find(function(j){return j.date===date}); }
function formatJournalDateLabel(dateStr){
  var d=new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
}
function renderJournalToday(){
  var date=todayStr();
  var entry=findJournalEntry(date)||normalizeJournalEntry({date:date});
  document.getElementById('jn-today-date').textContent=formatJournalDateLabel(date)+' · Today';
  document.getElementById('jn-today-moods').innerHTML=JOURNAL_MOODS.map(function(m){
    return '<button type="button" class="jn-mood'+(entry.mood===m?' sel':'')+'" data-mood="'+m+'">'+JOURNAL_MOOD_LABEL[m]+'</button>';
  }).join('');
  document.getElementById('jn-today-body').value=entry.body;
}
document.getElementById('jn-today-moods').addEventListener('click',function(e){
  var btn=e.target.closest('.jn-mood'); if(!btn)return;
  var date=todayStr();
  var mood=btn.dataset.mood;
  var entry=findJournalEntry(date);
  var body=document.getElementById('jn-today-body').value;
  if(!entry){
    if(!body.trim() && !mood)return;
    entry=normalizeJournalEntry({date:date}); journalEntries.push(entry);
  }
  entry.mood = entry.mood===mood ? '' : mood;
  entry.modifiedAt=Date.now();
  if(!entry.body.trim() && !entry.mood){
    journalEntries=journalEntries.filter(function(j){return j.id!==entry.id});
  }
  saveJournalEntries(); renderJournalToday(); renderJournalPast();
});
document.getElementById('jn-today-body').addEventListener('input',function(e){
  clearTimeout(jnSaveTimer);
  var hint=document.getElementById('jn-today-hint');
  hint.textContent='Saving…';
  jnSaveTimer=setTimeout(function(){
    var date=todayStr();
    var body=e.target.value;
    var entry=findJournalEntry(date);
    if(!entry){
      if(!body.trim())return;
      entry=normalizeJournalEntry({date:date}); journalEntries.push(entry);
    }
    entry.body=body;
    entry.modifiedAt=Date.now();
    if(!entry.body.trim() && !entry.mood){
      journalEntries=journalEntries.filter(function(j){return j.id!==entry.id});
    }
    saveJournalEntries();
    hint.textContent='Saved';
    renderJournalPast();
  },500);
});
var jnExpandedId=null;
function renderJournalPast(){
  var list=document.getElementById('jn-past-list');
  var empty=document.getElementById('jn-past-empty');
  var today=todayStr();
  var past=journalEntries.filter(function(j){return j.date!==today}).sort(function(a,b){return b.date.localeCompare(a.date)});
  empty.style.display=past.length?'none':'';
  list.innerHTML=past.map(function(j){
    var preview=(j.body||'').replace(/\s+/g,' ').trim().slice(0,80)||'(no notes)';
    var open=j.id===jnExpandedId;
    var moods=JOURNAL_MOODS.map(function(m){
      return '<button type="button" class="jn-mood'+(j.mood===m?' sel':'')+'" data-past-mood="'+m+'">'+JOURNAL_MOOD_LABEL[m]+'</button>';
    }).join('');
    return '<div class="jn-past-item'+(open?' open':'')+'" data-id="'+esc(j.id)+'">'
      +'<div class="jn-past-row" data-action="expand">'
      +'<svg class="jn-past-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>'
      +'<span class="jn-past-dot" data-mood="'+esc(j.mood)+'"></span>'
      +'<div class="jn-past-main"><div class="jn-past-date">'+esc(formatJournalDateLabel(j.date))+'</div>'
      +'<div class="jn-past-preview">'+esc(preview)+'</div></div>'
      +'<button class="jn-past-del" data-action="delete" aria-label="Delete entry">×</button>'
      +'</div>'
      +'<div class="jn-past-edit"><div class="jn-moods">'+moods+'</div>'
      +'<textarea class="jn-body" data-past-body rows="4">'+esc(j.body)+'</textarea></div>'
      +'</div>';
  }).join('');
}
function updateJnPastRowSummary(id){
  var entry=journalEntries.find(function(j){return j.id===id}); if(!entry)return;
  var item=document.querySelector('.jn-past-item[data-id="'+CSS.escape(id)+'"]'); if(!item)return;
  var preview=(entry.body||'').replace(/\s+/g,' ').trim().slice(0,80)||'(no notes)';
  var prevEl=item.querySelector('.jn-past-preview'); if(prevEl)prevEl.textContent=preview;
}
var jnPastSaveTimer=null;
document.getElementById('jn-past-list').addEventListener('click',function(e){
  var item=e.target.closest('.jn-past-item'); if(!item)return;
  var id=item.dataset.id;
  var entry=journalEntries.find(function(j){return j.id===id}); if(!entry)return;
  if(e.target.closest('[data-action="delete"]')){
    hubConfirm('Delete this entry?',formatJournalDateLabel(entry.date),'Delete').then(function(ok){
      if(!ok)return;
      journalEntries=journalEntries.filter(function(j){return j.id!==id});
      if(jnExpandedId===id)jnExpandedId=null;
      saveJournalEntries(); renderJournalPast();
    });
    return;
  }
  var moodBtn=e.target.closest('[data-past-mood]');
  if(moodBtn){
    var mood=moodBtn.dataset.pastMood;
    entry.mood = entry.mood===mood ? '' : mood;
    entry.modifiedAt=Date.now();
    saveJournalEntries(); renderJournalPast();
    return;
  }
  if(e.target.closest('[data-action="expand"]')){
    jnExpandedId = (jnExpandedId===id) ? null : id;
    renderJournalPast();
  }
});
document.getElementById('jn-past-list').addEventListener('input',function(e){
  if(!e.target.matches('[data-past-body]'))return;
  var item=e.target.closest('.jn-past-item'); var id=item.dataset.id;
  var entry=journalEntries.find(function(j){return j.id===id}); if(!entry)return;
  clearTimeout(jnPastSaveTimer);
  jnPastSaveTimer=setTimeout(function(){
    entry.body=e.target.value; entry.modifiedAt=Date.now();
    saveJournalEntries();
    updateJnPastRowSummary(id); // targeted update — avoids re-rendering the textarea mid-type
  },500);
});

// ============================================================================
// Sign-in → pull → render. This is the ONLY path into the Hub UI — there is no
// local-only fallback (see the file header comment for why).
// ============================================================================
function onSignedIn(user){
  currentUser=user;
  document.getElementById('auth-gate').style.display='none';
  document.getElementById('hub-app').style.display='block';
  setAuthStatus('');
  renderAccountButton(user);
  loadTodosLocal();
  return loadJournalLocal().then(function(){
    return Promise.all([pullMetaFromCloud('todos'),pullMetaFromCloud('journal')]);
  }).then(function(results){
    var cloudTodos=results[0], cloudJournal=results[1];
    if(Array.isArray(cloudTodos)){
      todos=cloudTodos;
      localStorage.setItem(TODOS_KEY,JSON.stringify(todos));
      bumpSyncTimestamp('todos');
    }else{
      pushMetaToCloud('todos',todos); // local was at least as new — make sure cloud has it too
    }
    if(Array.isArray(cloudJournal)){
      journalEntries=cloudJournal.map(normalizeJournalEntry);
      return idbSet(JOURNAL_KEY,journalEntries).then(function(){ bumpSyncTimestamp('journal'); });
    }else{
      pushMetaToCloud('journal',journalEntries);
    }
  }).catch(function(e){
    console.warn('[sakura hub] cloud pull failed, showing local cache instead:',e);
  }).finally(function(){
    renderTodos();
    renderJournalToday();
    renderJournalPast();
  });
}

// ============================================================================
// Tabs & misc
// ============================================================================
document.getElementById('hub-tabs').addEventListener('click',function(e){
  var btn=e.target.closest('.hub-tab'); if(!btn)return;
  document.querySelectorAll('.hub-tab').forEach(function(b){b.classList.toggle('active',b===btn)});
  var view=btn.dataset.view;
  document.querySelectorAll('.hub-view').forEach(function(v){v.classList.toggle('active',v.id==='view-'+view)});
});

boot();
</script>
